<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURE TERMINAL</title>
    <!-- Pull in PeerJS for Peer-to-Peer direct connections -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --term-green: #33ff00;
            --term-dark: #051a05;
            --bg-color: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--term-green);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            padding: 10px;
        }

        .terminal-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            border: 2px solid var(--term-green);
            background-color: var(--term-dark);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 0 0 15px rgba(51, 255, 0, 0.2);
        }

        /* Views */
        #boot-screen, #lobby-screen, #chat-screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        #boot-screen.active, #lobby-screen.active, #chat-screen.active {
            display: flex;
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px dashed var(--term-green);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-weight: bold;
        }

        input {
            background-color: transparent;
            border: 1px solid var(--term-green);
            color: var(--term-green);
            padding: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            background-color: rgba(51, 255, 0, 0.1);
        }

        button {
            background-color: transparent;
            border: 1px solid var(--term-green);
            color: var(--term-green);
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--term-green);
            color: var(--bg-color);
        }

        /* Chat Layout */
        #chat-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--term-green);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        #chat-log {
            flex-grow: 1;
            overflow-y: auto;
            border: 1px dashed var(--term-green);
            padding: 10px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg { word-wrap: break-word; }
        .msg-sys { opacity: 0.7; font-style: italic; }
        .msg-self { color: #ccffcc; }
        .msg-remote { color: #ffffff; }

        #chat-form {
            display: flex;
            gap: 10px;
        }

        #chat-input {
            flex-grow: 1;
        }
    </style>
</head>
<body>

    <div class="terminal-container">
        
        <!-- BOOT SCREEN -->
        <div id="boot-screen" class="active">
            <h2>SYSTEM BOOT</h2>
            <p id="boot-text">> INITIALIZING KERNEL...</p>
        </div>

        <!-- LOBBY SCREEN -->
        <div id="lobby-screen">
            <h1>NEXUS P2P TERMINAL</h1>
            
            <div class="form-group">
                <label>> ENTER OPERATOR ALIAS:</label>
                <input type="text" id="alias-input" placeholder="e.g. Ghost" required>
            </div>

            <br><hr style="border-color: var(--term-green); opacity: 0.5;"><br>

            <div class="form-group">
                <label>> TO HOST A NEW SECURE LINE:</label>
                <button type="button" id="btn-host">[ INITIALIZE HOST ROOM ]</button>
            </div>

            <br><hr style="border-color: var(--term-green); opacity: 0.5;"><br>

            <div class="form-group">
                <label>> TO JOIN AN EXISTING LINE:</label>
                <input type="text" id="code-input" placeholder="ENTER 6-DIGIT CODE" maxlength="6">
                <button type="button" id="btn-join">[ CONNECT TO ROOM ]</button>
            </div>
        </div>

        <!-- CHAT SCREEN -->
        <div id="chat-screen">
            <div id="chat-header">
                <span id="display-alias">OP: UNKNOWN</span>
                <span id="display-code">CODE: ------</span>
                <span id="display-status">STATUS: WAIT</span>
            </div>
            
            <div id="chat-log"></div>

            <form id="chat-form">
                <input type="text" id="chat-input" placeholder="> TYPE MESSAGE..." autocomplete="off">
                <button type="submit" id="btn-send">[ SEND ]</button>
            </form>
        </div>

    </div>

    <script>
        // DOM Elements
        const bootScreen = document.getElementById('boot-screen');
        const lobbyScreen = document.getElementById('lobby-screen');
        const chatScreen = document.getElementById('chat-screen');
        const bootText = document.getElementById('boot-text');
        const chatLog = document.getElementById('chat-log');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        
        // App State
        let peer = null;
        let p2pConnection = null;
        let myAlias = 'Operator';
        let currentRoomCode = '';

        // --- 1. BOOT SEQUENCE ---
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { bootText.innerText += '\n> LOADING P2P PROTOCOLS...'; }, 500);
            setTimeout(() => { bootText.innerText += '\n> BYPASSING MAINFRAME...'; }, 1200);
            setTimeout(() => {
                bootScreen.classList.remove('active');
                lobbyScreen.classList.active = true;
                lobbyScreen.style.display = 'flex'; // Force display
            }, 2000);
            
            // Bind Buttons
            document.getElementById('btn-host').addEventListener('click', startHost);
            document.getElementById('btn-join').addEventListener('click', startClient);
            chatForm.addEventListener('submit', sendMessage);
        });

        // --- 2. HOSTING A ROOM ---
        function startHost() {
            const inputAlias = document.getElementById('alias-input').value.trim();
            if(inputAlias) myAlias = inputAlias;

            // Generate random 6 digit code
            currentRoomCode = Math.floor(100000 + Math.random() * 900000).toString();
            const peerId = 'nexus-room-' + currentRoomCode;

            switchToChat(currentRoomCode, 'LISTENING...');

            // Initialize Peer with specific ID
            peer = new Peer(peerId);
            
            peer.on('open', (id) => {
                logSystem(`Host line established. Waiting for remote connection on code: ${currentRoomCode}`);
            });

            // Listen for incoming connection
            peer.on('connection', (conn) => {
                p2pConnection = conn;
                setupConnectionData();
                logSystem(`INCOMING CONNECTION ACCEPTED.`);
                document.getElementById('display-status').innerText = 'STATUS: CONNECTED';
            });

            peer.on('error', (err) => logSystem(`SYS ERROR: ${err.type}`));
        }

        // --- 3. JOINING A ROOM ---
        function startClient() {
            const inputAlias = document.getElementById('alias-input').value.trim();
            const inputCode = document.getElementById('code-input').value.trim();
            
            if(inputAlias) myAlias = inputAlias;
            if(!inputCode || inputCode.length !== 6) {
                alert("Please enter a valid 6-digit code.");
                return;
            }

            currentRoomCode = inputCode;
            switchToChat(currentRoomCode, 'SEARCHING...');

            // Initialize Peer with random client ID
            peer = new Peer();
            
            peer.on('open', (id) => {
                logSystem(`Searching network for room code ${currentRoomCode}...`);
                const targetId = 'nexus-room-' + currentRoomCode;
                p2pConnection = peer.connect(targetId);
                setupConnectionData();
            });

            peer.on('error', (err) => logSystem(`SYS ERROR: ${err.type}`));
        }

        // --- 4. CONNECTION HANDLING ---
        function setupConnectionData() {
            p2pConnection.on('open', () => {
                logSystem(`SECURE TUNNEL ESTABLISHED.`);
                document.getElementById('display-status').innerText = 'STATUS: CONNECTED';
                
                // Say hello automatically
                p2pConnection.send({ type: 'sys', text: `${myAlias} has entered the line.` });
            });

            p2pConnection.on('data', (data) => {
                if (data.type === 'sys') {
                    logSystem(data.text);
                } else {
                    logMessage(data.sender, data.text, 'msg-remote');
                }
            });

            p2pConnection.on('close', () => {
                logSystem('WARNING: REMOTE CONNECTION LOST.');
                document.getElementById('display-status').innerText = 'STATUS: DISCONNECTED';
            });
        }

        // --- 5. MESSAGING ---
        function sendMessage(e) {
            e.preventDefault();
            const text = chatInput.value.trim();
            
            if (text && p2pConnection && p2pConnection.open) {
                // Send to peer
                p2pConnection.send({ type: 'msg', sender: myAlias, text: text });
                // Print locally
                logMessage(myAlias, text, 'msg-self');
                chatInput.value = '';
            } else if (!p2pConnection || !p2pConnection.open) {
                logSystem('SYS ERROR: Tunnel not open. Message dropped.');
            }
        }

        // --- UI UTILS ---
        function switchToChat(code, statusStr) {
            document.getElementById('lobby-screen').style.display = 'none';
            chatScreen.classList.add('active');
            
            document.getElementById('display-alias').innerText = `OP: ${myAlias.toUpperCase()}`;
            document.getElementById('display-code').innerText = `CODE: ${code}`;
            document.getElementById('display-status').innerText = `STATUS: ${statusStr}`;
            
            chatInput.focus();
        }

        function logSystem(text) {
            const div = document.createElement('div');
            div.className = 'msg msg-sys';
            div.innerText = `> ${text}`;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        function logMessage(sender, text, cssClass) {
            const div = document.createElement('div');
            div.className = `msg ${cssClass}`;
            div.innerText = `[${sender}]: ${text}`;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        }
    </script>
</body>
</html>
