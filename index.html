<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL CHAT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        :root {
            --term-green: #00ff00;
            --term-black: #000000;
        }

        body {
            background-color: var(--term-black);
            color: var(--term-green);
            font-family: 'VT323', 'Courier New', Courier, monospace;
            font-size: 1.5rem; 
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        input {
            background-color: var(--term-black);
            color: var(--term-green);
            border: 1px solid var(--term-green);
            padding: 0.5rem;
            font-family: inherit;
            font-size: 1.5rem;
            outline: none;
            width: 100%;
            caret-color: var(--term-green);
        }

        input:focus {
            border-width: 2px;
        }

        button {
            background-color: var(--term-black);
            color: var(--term-green);
            border: 1px solid var(--term-green);
            padding: 0.5rem 1rem;
            font-family: inherit;
            font-size: 1.5rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.1s ease;
        }

        button:hover {
            background-color: var(--term-green);
            color: var(--term-black);
        }

        .hide {
            display: none !important;
        }

        /* Custom Scrollbar for message log */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--term-black); border-left: 1px solid var(--term-green); }
        ::-webkit-scrollbar-thumb { background: var(--term-green); }

        .blink {
            animation: blink-animation 1s steps(2, start) infinite;
        }
        @keyframes blink-animation {
            to { visibility: hidden; }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto w-full h-full flex flex-col border-2 border-[#00ff00] p-4">
        
        <header class="border-b border-[#00ff00] pb-2 mb-4">
            <h1 class="text-4xl uppercase m-0 leading-none tracking-widest">SYS_COMM_LINK</h1>
        </header>

        <main id="boot-screen" class="flex-1 flex flex-col justify-center items-center text-center">
            <div class="space-y-4">
                <div>> INITIALIZING SYSTEM...</div>
                <div>> ESTABLISHING SECURE CONNECTION...</div>
                <div class="blink">_</div>
            </div>
        </main>

        <main id="lobby-screen" class="hide flex-1 flex flex-col justify-center max-w-lg mx-auto w-full space-y-8">
            <div class="space-y-2">
                <label class="block uppercase">> ENTER_OPERATOR_NAME</label>
                <input type="text" id="username-input" placeholder="e.g. NEO" maxlength="12" autocomplete="off">
            </div>

            <div class="border-t border-dashed border-[#00ff00] pt-8 space-y-6">
                <button id="btn-create" class="w-full">
                    [ CREATE_NEW_ROOM ]
                </button>
                
                <div class="text-center">-- OR --</div>
                
                <div class="flex space-x-4">
                    <input type="text" id="join-code-input" placeholder="6-DIGIT CODE" maxlength="6" autocomplete="off" class="text-center tracking-widest w-2/3">
                    <button id="btn-join" class="w-1/3">
                        [ JOIN ]
                    </button>
                </div>
                <div id="lobby-error" class="text-red-500 text-sm hide">> ERROR: INVALID INPUT</div>
            </div>
        </main>

        <main id="chat-screen" class="hide flex-1 flex flex-col overflow-hidden">
            <div class="flex justify-between border-b border-dashed border-[#00ff00] pb-2 mb-4 uppercase">
                <div id="chat-info">OPERATOR: ??? | ROOM: ???</div>
                <button id="btn-disconnect" class="text-sm py-1 px-2">DISCONNECT</button>
            </div>

            <div id="message-log" class="flex-1 overflow-y-auto flex flex-col space-y-2 mb-4 pb-2 pr-2">
                <!-- Messages populate here -->
            </div>

            <form id="chat-form" class="flex items-center space-x-4 mt-auto">
                <span class="mb-1 text-2xl">></span>
                <input type="text" id="chat-input" placeholder="TYPE TRANSMISSION..." autocomplete="off">
                <button type="submit" id="btn-send">SEND</button>
            </form>
        </main>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Variables from Environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'terminal-chat-app';
        let firebaseConfig = {};
        let customToken = null;
        
        try {
            if (typeof __firebase_config !== 'undefined') firebaseConfig = JSON.parse(__firebase_config);
            if (typeof __initial_auth_token !== 'undefined') customToken = __initial_auth_token;
        } catch(e) {
            console.error("Config parse error. Ensure environment variables are set.", e);
        }

        let app, auth, db;

        // App State
        let currentUser = null;
        let myUsername = "";
        let currentRoom = "";
        let unsubscribe = null;
        let bootTimeout = null;

        // DOM Elements
        const bootScreen = document.getElementById('boot-screen');
        const lobbyScreen = document.getElementById('lobby-screen');
        const chatScreen = document.getElementById('chat-screen');
        
        const usernameInput = document.getElementById('username-input');
        const btnCreate = document.getElementById('btn-create');
        const joinCodeInput = document.getElementById('join-code-input');
        const btnJoin = document.getElementById('btn-join');
        const lobbyError = document.getElementById('lobby-error');
        
        const chatInfo = document.getElementById('chat-info');
        const btnDisconnect = document.getElementById('btn-disconnect');
        const messageLog = document.getElementById('message-log');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');

        async function bootSystem() {
            // 5-second failsafe timeout to prevent infinite loading screen
            bootTimeout = setTimeout(() => {
                if (!currentUser) {
                    console.warn("System boot timeout. Forcing lobby entry.");
                    bootScreen.classList.add('hide');
                    lobbyScreen.classList.remove('hide');
                    showError("SYS_TIMEOUT: DB CONNECTION HUNG. OFFLINE MODE.");
                    usernameInput.focus();
                }
            }, 5000);

            try {
                // Initialize Firebase securely inside try-catch
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                // Listen for Auth State
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        clearTimeout(bootTimeout);
                        currentUser = user;
                        // Reveal interactive lobby only after Auth is confirmed
                        bootScreen.classList.add('hide');
                        lobbyScreen.classList.remove('hide');
                        usernameInput.focus();
                    }
                });

                if (customToken) {
                    await signInWithCustomToken(auth, customToken);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth/Init Error:", err);
                clearTimeout(bootTimeout);
                bootScreen.classList.add('hide');
                lobbyScreen.classList.remove('hide');
                showError("FATAL: INITIALIZATION FAILED. OFFLINE MODE.");
                usernameInput.focus();
            }
        }

        bootSystem();

        usernameInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase().replace(/\s/g, '');
            lobbyError.classList.add('hide');
        });

        joinCodeInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            lobbyError.classList.add('hide');
        });

        btnCreate.addEventListener('click', () => {
            const name = usernameInput.value.trim();
            if (!name) {
                showError("OPERATOR NAME REQUIRED");
                return;
            }
            myUsername = name;
            // Generate 6 digit code
            currentRoom = Math.floor(100000 + Math.random() * 900000).toString();
            enterChat();
        });

        btnJoin.addEventListener('click', () => {
            const name = usernameInput.value.trim();
            const code = joinCodeInput.value.trim();
            
            if (!name) {
                showError("OPERATOR NAME REQUIRED");
                return;
            }
            if (code.length !== 6) {
                showError("CODE MUST BE 6 DIGITS");
                return;
            }

            myUsername = name;
            currentRoom = code;
            enterChat();
        });

        function showError(msg) {
            lobbyError.textContent = `> ERROR: ${msg}`;
            lobbyError.classList.remove('hide');
        }

        function enterChat() {
            lobbyScreen.classList.add('hide');
            chatScreen.classList.remove('hide');
            
            chatInfo.textContent = `OPERATOR: [${myUsername}] | ROOM: [${currentRoom}]`;
            chatInput.focus();
            
            messageLog.innerHTML = `<div class="opacity-70 italic">> ROOM [${currentRoom}] SECURED. AWAITING TRANSMISSIONS...</div>`;
            
            startSync();
        }

        function startSync() {
            if (!currentUser || !currentRoom) return;

            // Strict Rule 1: Exact Public Path
            const messagesRef = collection(db, 'artifacts', appId, 'public', 'data', 'nexus_comms');

            // Strict Rule 2: Fetch all, filter in memory
            unsubscribe = onSnapshot(messagesRef, (snapshot) => {
                const msgs = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.roomCode === currentRoom) {
                        msgs.push(data);
                    }
                });

                // Sort in memory by time
                msgs.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                renderMessages(msgs);

            }, (error) => {
                console.error("Sync Error:", error);
                messageLog.innerHTML += `<div class="text-red-500">> CONNECTION LOST.</div>`;
            });
        }

        function renderMessages(msgs) {
            // Keep intro message
            messageLog.innerHTML = `<div class="opacity-70 italic mb-4">> ROOM [${currentRoom}] SECURED. AWAITING TRANSMISSIONS...</div>`;
            
            msgs.forEach(msg => {
                const el = document.createElement('div');
                const time = new Date(msg.timestamp).toLocaleTimeString([], { hour12: false });
                
                if (msg.sender === myUsername) {
                    el.innerHTML = `<span class="opacity-50">[${time}]</span> <strong>> YOU:</strong> ${escapeHtml(msg.text)}`;
                } else {
                    el.innerHTML = `<span class="opacity-50">[${time}]</span> <strong>> ${escapeHtml(msg.sender)}:</strong> ${escapeHtml(msg.text)}`;
                }
                
                messageLog.appendChild(el);
            });
            
            // Auto scroll to bottom
            messageLog.scrollTop = messageLog.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text || !currentUser || !currentRoom) return;
            
            chatInput.value = ""; 
            chatInput.focus();

            try {
                const messagesRef = collection(db, 'artifacts', appId, 'public', 'data', 'nexus_comms');
                await addDoc(messagesRef, {
                    roomCode: currentRoom,
                    sender: myUsername,
                    text: text,
                    timestamp: Date.now()
                });
            } catch (err) {
                console.error("Send error:", err);
            }
        });

        btnDisconnect.addEventListener('click', () => {
            if (unsubscribe) {
                unsubscribe();
                unsubscribe = null;
            }
            currentRoom = "";
            chatScreen.classList.add('hide');
            lobbyScreen.classList.remove('hide');
            joinCodeInput.value = "";
            usernameInput.focus();
        });

        function escapeHtml(str) {
            if (!str) return '';
            return str.toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
