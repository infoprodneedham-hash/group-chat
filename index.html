<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURE TERMINAL - MULTI-OP</title>
    <!-- Pull in PeerJS for Peer-to-Peer direct connections -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --term-green: #33ff00;
            --term-dark: #051a05;
            --bg-color: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--term-green);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            padding: 10px;
        }

        .terminal-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            border: 2px solid var(--term-green);
            background-color: var(--term-dark);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 0 0 15px rgba(51, 255, 0, 0.2);
        }

        /* Views */
        #boot-screen, #lobby-screen, #chat-screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        #boot-screen.active, #lobby-screen.active, #chat-screen.active {
            display: flex;
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px dashed var(--term-green);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-weight: bold;
        }

        input {
            background-color: transparent;
            border: 1px solid var(--term-green);
            color: var(--term-green);
            padding: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            background-color: rgba(51, 255, 0, 0.1);
        }

        button {
            background-color: transparent;
            border: 1px solid var(--term-green);
            color: var(--term-green);
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--term-green);
            color: var(--bg-color);
        }

        /* Chat Layout */
        #chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--term-green);
            padding-bottom: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-stats {
            display: flex;
            gap: 15px;
        }

        #btn-leave {
            padding: 5px 10px;
            font-size: 14px;
            border-color: #ff3333;
            color: #ff3333;
        }
        
        #btn-leave:hover {
            background-color: #ff3333;
            color: var(--bg-color);
        }

        #chat-log {
            flex-grow: 1;
            overflow-y: auto;
            border: 1px dashed var(--term-green);
            padding: 10px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg { word-wrap: break-word; }
        .msg-sys { opacity: 0.7; font-style: italic; }
        .msg-self { color: #ccffcc; }
        .msg-remote { color: #ffffff; }

        #chat-form {
            display: flex;
            gap: 10px;
        }

        #chat-input {
            flex-grow: 1;
        }
    </style>
</head>
<body>

    <div class="terminal-container">
        
        <!-- BOOT SCREEN -->
        <div id="boot-screen" class="active">
            <h2>SYSTEM BOOT</h2>
            <p id="boot-text">> INITIALIZING KERNEL...</p>
        </div>

        <!-- LOBBY SCREEN -->
        <div id="lobby-screen">
            <h1>NEXUS P2P TERMINAL</h1>
            
            <div class="form-group">
                <label>> ENTER OPERATOR ALIAS:</label>
                <input type="text" id="alias-input" placeholder="e.g. Ghost" required>
            </div>

            <br><hr style="border-color: var(--term-green); opacity: 0.5;"><br>

            <div class="form-group">
                <label>> TO HOST A NEW SECURE LINE (MULTI-USER):</label>
                <button type="button" id="btn-host">[ INITIALIZE HOST ROOM ]</button>
            </div>

            <br><hr style="border-color: var(--term-green); opacity: 0.5;"><br>

            <div class="form-group">
                <label>> TO JOIN AN EXISTING LINE:</label>
                <input type="text" id="code-input" placeholder="ENTER 6-DIGIT CODE" maxlength="6">
                <button type="button" id="btn-join">[ CONNECT TO ROOM ]</button>
            </div>
        </div>

        <!-- CHAT SCREEN -->
        <div id="chat-screen">
            <div id="chat-header">
                <div class="header-stats">
                    <span id="display-alias">OP: UNKNOWN</span>
                    <span id="display-code">CODE: ------</span>
                    <span id="display-status">STATUS: WAIT</span>
                </div>
                <button type="button" id="btn-leave">[ DISCONNECT ]</button>
            </div>
            
            <div id="chat-log"></div>

            <form id="chat-form">
                <input type="text" id="chat-input" placeholder="> TYPE MESSAGE..." autocomplete="off">
                <button type="submit" id="btn-send">[ SEND ]</button>
            </form>
        </div>

    </div>

    <script>
        // DOM Elements
        const bootScreen = document.getElementById('boot-screen');
        const lobbyScreen = document.getElementById('lobby-screen');
        const chatScreen = document.getElementById('chat-screen');
        const bootText = document.getElementById('boot-text');
        const chatLog = document.getElementById('chat-log');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        
        // App State
        let peer = null;
        let connections = []; // Array to hold all connected users
        let isHost = false;
        let myAlias = 'Operator';
        let currentRoomCode = '';

        // --- 1. BOOT SEQUENCE ---
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { bootText.innerText += '\n> LOADING P2P PROTOCOLS...'; }, 500);
            setTimeout(() => { bootText.innerText += '\n> BYPASSING MAINFRAME...'; }, 1200);
            setTimeout(() => {
                bootScreen.classList.remove('active');
                lobbyScreen.classList.active = true;
                lobbyScreen.style.display = 'flex';
            }, 2000);
            
            // Bind Buttons
            document.getElementById('btn-host').addEventListener('click', startHost);
            document.getElementById('btn-join').addEventListener('click', startClient);
            document.getElementById('btn-leave').addEventListener('click', disconnectNetwork);
            chatForm.addEventListener('submit', sendMessage);
        });

        // --- 2. HOSTING A ROOM (Acts as the Hub) ---
        function startHost() {
            const inputAlias = document.getElementById('alias-input').value.trim();
            if(inputAlias) myAlias = inputAlias;
            isHost = true;

            // Generate random 6 digit code
            currentRoomCode = Math.floor(100000 + Math.random() * 900000).toString();
            const peerId = 'nexus-room-' + currentRoomCode;

            switchToChat(currentRoomCode, 'LISTENING (HOST)...');

            peer = new Peer(peerId);
            
            peer.on('open', (id) => {
                logSystem(`Host line established. Awaiting operators on code: ${currentRoomCode}`);
            });

            // Listen for incoming connections from multiple clients
            peer.on('connection', (conn) => {
                connections.push(conn);
                setupConnectionData(conn);
                logSystem(`INCOMING CONNECTION ACCEPTED.`);
                updateStatus();
            });

            peer.on('error', (err) => logSystem(`SYS ERROR: ${err.type}`));
        }

        // --- 3. JOINING A ROOM (Connects to the Hub) ---
        function startClient() {
            const inputAlias = document.getElementById('alias-input').value.trim();
            const inputCode = document.getElementById('code-input').value.trim();
            
            if(inputAlias) myAlias = inputAlias;
            if(!inputCode || inputCode.length !== 6) {
                alert("Please enter a valid 6-digit code.");
                return;
            }

            isHost = false;
            currentRoomCode = inputCode;
            switchToChat(currentRoomCode, 'SEARCHING...');

            peer = new Peer();
            
            peer.on('open', (id) => {
                logSystem(`Searching network for room code ${currentRoomCode}...`);
                const targetId = 'nexus-room-' + currentRoomCode;
                const conn = peer.connect(targetId);
                connections.push(conn);
                setupConnectionData(conn);
            });

            peer.on('error', (err) => {
                logSystem(`SYS ERROR: ${err.type}`);
                if(err.type === 'peer-unavailable') {
                    logSystem('Room not found. The host may have disconnected.');
                }
            });
        }

        // --- 4. CONNECTION HANDLING ---
        function setupConnectionData(conn) {
            conn.on('open', () => {
                logSystem(`SECURE TUNNEL ESTABLISHED.`);
                updateStatus();
                
                // Introduce yourself to the network
                conn.send({ type: 'sys', text: `${myAlias} has entered the line.` });
            });

            conn.on('data', (data) => {
                // Display the received message
                if (data.type === 'sys') {
                    logSystem(data.text);
                } else {
                    logMessage(data.sender, data.text, 'msg-remote');
                }

                // **CRITICAL FOR MULTI-USER**: If I am the Host, bounce this message to everyone else!
                if (isHost) {
                    broadcast(data, conn); // Pass 'conn' to exclude the sender from receiving their own message back
                }
            });

            conn.on('close', () => {
                logSystem('WARNING: A REMOTE CONNECTION WAS LOST.');
                // Remove this connection from our active array
                connections = connections.filter(c => c !== conn);
                updateStatus();
            });
        }

        // --- 5. MESSAGING & BROADCASTING ---
        function sendMessage(e) {
            e.preventDefault();
            const text = chatInput.value.trim();
            
            if (text && connections.length > 0) {
                // Send to all connected peers
                broadcast({ type: 'msg', sender: myAlias, text: text });
                // Print locally
                logMessage(myAlias, text, 'msg-self');
                chatInput.value = '';
            } else if (connections.length === 0) {
                logSystem('SYS ERROR: No active connections. Message dropped.');
            }
        }

        function broadcast(data, excludeConn = null) {
            connections.forEach(conn => {
                // Send to everyone EXCEPT the person who originally sent it to us (if any)
                if (conn !== excludeConn && conn.open) {
                    conn.send(data);
                }
            });
        }

        // --- 6. DISCONNECT & CLEANUP ---
        function disconnectNetwork() {
            logSystem('Disconnecting from network...');
            
            if (peer) {
                peer.destroy(); // Destroys the peer and all associated connections
            }
            
            // Reset App State
            peer = null;
            connections = [];
            isHost = false;
            currentRoomCode = '';
            
            // Reset UI
            chatLog.innerHTML = '';
            document.getElementById('chat-screen').classList.remove('active');
            document.getElementById('chat-screen').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'flex';
        }

        // --- UI UTILS ---
        function switchToChat(code, statusStr) {
            document.getElementById('lobby-screen').style.display = 'none';
            chatScreen.classList.add('active');
            chatScreen.style.display = 'flex';
            
            document.getElementById('display-alias').innerText = `OP: ${myAlias.toUpperCase()}`;
            document.getElementById('display-code').innerText = `CODE: ${code}`;
            document.getElementById('display-status').innerText = `STATUS: ${statusStr}`;
            
            chatInput.focus();
        }

        function updateStatus() {
            if (connections.length > 0) {
                const count = isHost ? connections.length : 1;
                document.getElementById('display-status').innerText = `STATUS: ONLINE [${count} PEER(S)]`;
            } else {
                document.getElementById('display-status').innerText = 'STATUS: WAITING/DISCONNECTED';
            }
        }

        function logSystem(text) {
            const div = document.createElement('div');
            div.className = 'msg msg-sys';
            div.innerText = `> ${text}`;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        function logMessage(sender, text, cssClass) {
            const div = document.createElement('div');
            div.className = `msg ${cssClass}`;
            div.innerText = `[${sender}]: ${text}`;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        }
    </script>
</body>
</html>
