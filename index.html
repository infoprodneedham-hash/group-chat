<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL CHAT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        :root {
            --term-green: #33ff00;
            --term-black: #000000;
        }

        body {
            background-color: var(--term-black);
            color: var(--term-green);
            font-family: 'VT323', monospace;
            font-size: 1.25rem; /* 20px base */
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        input {
            background-color: var(--term-black);
            color: var(--term-green);
            border: 1px solid var(--term-green);
            padding: 0.5rem;
            font-family: 'VT323', monospace;
            font-size: 1.25rem;
            outline: none;
            width: 100%;
        }

        input:focus {
            border-width: 2px;
        }

        button {
            background-color: var(--term-black);
            color: var(--term-green);
            border: 1px solid var(--term-green);
            padding: 0.5rem 1rem;
            font-family: 'VT323', monospace;
            font-size: 1.25rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        button:hover:not(:disabled) {
            background-color: var(--term-green);
            color: var(--term-black);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-style: dashed;
        }

        .hide {
            display: none !important;
        }

        /* Custom Scrollbar for message log */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--term-black); border-left: 1px solid var(--term-green); }
        ::-webkit-scrollbar-thumb { background: var(--term-green); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-3xl mx-auto w-full h-full flex flex-col border-2 border-[#33ff00] p-4">
        
        <!-- Header -->
        <header class="border-b border-[#33ff00] pb-2 mb-4 flex justify-between items-end">
            <div>
                <h1 class="text-3xl md:text-4xl uppercase m-0 leading-none">SYS_COMM_LINK</h1>
                <div id="sys-status" class="text-sm mt-1 animate-pulse">STATUS: INITIALIZING SYSTEM...</div>
            </div>
        </header>

        <!-- Lobby Section -->
        <main id="lobby-screen" class="flex-1 flex flex-col justify-center max-w-md mx-auto w-full space-y-6">
            <div class="space-y-2">
                <label class="block uppercase">> ENTER_USERNAME</label>
                <input type="text" id="username-input" placeholder="e.g. NEO" maxlength="12" autocomplete="off" disabled>
            </div>

            <div class="border-t border-dashed border-[#33ff00] pt-6 space-y-4">
                <button id="btn-create" class="w-full" disabled>
                    [ CREATE_NEW_NODE ]
                </button>
                
                <div class="text-center my-2">-- OR --</div>
                
                <div class="flex space-x-2">
                    <input type="text" id="join-code-input" placeholder="6-DIGIT CODE" maxlength="6" autocomplete="off" class="text-center tracking-widest" disabled>
                    <button id="btn-join" class="whitespace-nowrap" disabled>
                        [ JOIN ]
                    </button>
                </div>
                <div id="join-error" class="text-red-500 text-sm hide">> ERROR: CODE MUST BE 6 DIGITS</div>
            </div>
        </main>

        <!-- Chat Section -->
        <main id="chat-screen" class="hide flex-1 flex flex-col overflow-hidden">
            <div class="flex justify-between border-b border-dashed border-[#33ff00] pb-2 mb-2 text-sm uppercase">
                <div id="chat-info">USER: ??? | NODE: ???</div>
                <button id="btn-disconnect" class="text-xs py-1 px-2 border-none underline hover:bg-transparent hover:text-white">DISCONNECT</button>
            </div>

            <div id="message-log" class="flex-1 overflow-y-auto flex flex-col space-y-1 mb-4 pb-2">
                <!-- Messages will appear here -->
            </div>

            <form id="chat-form" class="flex items-center space-x-2 mt-auto">
                <span class="mb-1">></span>
                <input type="text" id="chat-input" placeholder="TYPE TRANSMISSION..." autocomplete="off">
                <button type="submit" id="btn-send">SEND</button>
            </form>
        </main>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Variables
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'terminal-chat-app';
        let firebaseConfig = {};
        let customToken = null;
        
        try {
            if (typeof __firebase_config !== 'undefined') firebaseConfig = JSON.parse(__firebase_config);
            if (typeof __initial_auth_token !== 'undefined') customToken = __initial_auth_token;
        } catch(e) {
            console.error("Config parse error:", e);
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // App State
        let currentUser = null;
        let myUsername = "";
        let currentRoom = "";
        let unsubscribe = null;

        // DOM Elements
        const sysStatus = document.getElementById('sys-status');
        const lobbyScreen = document.getElementById('lobby-screen');
        const chatScreen = document.getElementById('chat-screen');
        
        const usernameInput = document.getElementById('username-input');
        const btnCreate = document.getElementById('btn-create');
        const joinCodeInput = document.getElementById('join-code-input');
        const btnJoin = document.getElementById('btn-join');
        const joinError = document.getElementById('join-error');
        
        const chatInfo = document.getElementById('chat-info');
        const btnDisconnect = document.getElementById('btn-disconnect');
        const messageLog = document.getElementById('message-log');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');

        // 1. Authenticate FIRST
        async function bootSystem() {
            try {
                if (customToken) {
                    await signInWithCustomToken(auth, customToken);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                sysStatus.textContent = "STATUS: CONNECTION FAILED";
                console.error("Auth Error:", err);
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                sysStatus.textContent = "STATUS: ONLINE // READY";
                sysStatus.classList.remove('animate-pulse');
                
                // Enable inputs now that auth is complete
                usernameInput.disabled = false;
                joinCodeInput.disabled = false;
                usernameInput.focus();
                
                checkLobbyInputs();
            }
        });

        bootSystem();

        // 2. Lobby Logic
        function checkLobbyInputs() {
            if (!currentUser) return;
            const nameLen = usernameInput.value.trim().length;
            const codeLen = joinCodeInput.value.trim().length;

            btnCreate.disabled = nameLen === 0;
            btnJoin.disabled = nameLen === 0 || codeLen !== 6;
        }

        usernameInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase().replace(/\s/g, '');
            checkLobbyInputs();
        });

        joinCodeInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            joinError.classList.add('hide');
            checkLobbyInputs();
        });

        btnCreate.addEventListener('click', () => {
            myUsername = usernameInput.value.trim();
            currentRoom = Math.floor(100000 + Math.random() * 900000).toString();
            enterChat();
        });

        btnJoin.addEventListener('click', () => {
            const code = joinCodeInput.value.trim();
            if (code.length === 6) {
                myUsername = usernameInput.value.trim();
                currentRoom = code;
                enterChat();
            } else {
                joinError.classList.remove('hide');
            }
        });

        // 3. Chat Room Logic
        function enterChat() {
            lobbyScreen.classList.add('hide');
            chatScreen.classList.remove('hide');
            
            chatInfo.textContent = `USER: [${myUsername}] | NODE: [${currentRoom}]`;
            chatInput.focus();
            
            messageLog.innerHTML = `<div class="opacity-50 italic mb-4">> NODE LINK SECURED... WAITING FOR TRANSMISSIONS.</div>`;
            
            startSync();
        }

        function startSync() {
            if (!currentUser || !currentRoom) return;

            // Strict Rule 1: Use exact public path
            const messagesRef = collection(db, 'artifacts', appId, 'public', 'data', 'messages');

            // Strict Rule 2: Fetch all, filter in JavaScript memory (no complex queries)
            unsubscribe = onSnapshot(messagesRef, (snapshot) => {
                const msgs = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    // Filter in memory
                    if (data.roomCode === currentRoom) {
                        msgs.push(data);
                    }
                });

                // Sort in memory by time
                msgs.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                
                renderMessages(msgs);
            }, (error) => {
                console.error("Sync Error:", error);
                const errDiv = document.createElement('div');
                errDiv.textContent = "> ERROR: CONNECTION LOST.";
                errDiv.className = "text-red-500";
                messageLog.appendChild(errDiv);
            });
        }

        function renderMessages(msgs) {
            // Keep the intro message by finding it or just re-adding it
            messageLog.innerHTML = `<div class="opacity-50 italic mb-4">> NODE LINK SECURED... WAITING FOR TRANSMISSIONS.</div>`;
            
            msgs.forEach(msg => {
                const el = document.createElement('div');
                const time = new Date(msg.timestamp).toLocaleTimeString([], { hour12: false });
                
                if (msg.sender === myUsername) {
                    el.innerHTML = `<span class="opacity-50">[${time}]</span> <strong>> YOU:</strong> ${escapeHtml(msg.text)}`;
                } else {
                    el.innerHTML = `<span class="opacity-50">[${time}]</span> <strong>> ${escapeHtml(msg.sender)}:</strong> <span class="text-white">${escapeHtml(msg.text)}</span>`;
                }
                
                messageLog.appendChild(el);
            });
            
            // Auto scroll to bottom
            messageLog.scrollTop = messageLog.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text || !currentUser || !currentRoom) return;
            
            chatInput.value = ""; // Clear input UI immediately

            try {
                const messagesRef = collection(db, 'artifacts', appId, 'public', 'data', 'messages');
                await addDoc(messagesRef, {
                    roomCode: currentRoom,
                    sender: myUsername,
                    text: text,
                    timestamp: Date.now()
                });
            } catch (err) {
                console.error("Send error:", err);
            }
        });

        btnDisconnect.addEventListener('click', () => {
            if (unsubscribe) {
                unsubscribe();
                unsubscribe = null;
            }
            currentRoom = "";
            chatScreen.classList.add('hide');
            lobbyScreen.classList.remove('hide');
            joinCodeInput.value = "";
            checkLobbyInputs();
        });

        // Helper to prevent XSS
        function escapeHtml(str) {
            if (!str) return '';
            return str.toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

    </script>
</body>
</html>
