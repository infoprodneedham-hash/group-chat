    <div class="fixed bottom-2 right-2 z-[9999] max-w-sm w-full bg-cyber-darker border border-cyber-border rounded-lg shadow-2xl overflow-hidden font-tech text-xs opacity-90 hover:opacity-100 transition-opacity">

            <div class="flex items-center space-x-2">
                <span class="w-2 h-2 bg-cyber-magenta rounded-full animate-pulse"></span>
                <span class="font-orbitron font-bold text-cyber-magenta text-[11px]">DIAGNOSTIC CONSOLE</span>
            </div>
            <i class="fa-solid fa-chevron-up text-gray-400" id="debug-toggle-icon"></i>
        </div>
        <div id="debug-body" class="p-3 h-48 overflow-y-auto space-y-1 bg-black/95 text-gray-300 hidden">
            <!-- Dynamic logs -->
        </div>

    <script>
        // Diagnostic Logging Utility
        window.logDebug = function(level, text) {
            const body = document.getElementById('debug-body');
            const icon = document.getElementById('debug-toggle-icon');
            if (!body) return;
            const timeStr = new Date().toLocaleTimeString();
            let colorClass = 'text-gray-400';
            if (level === 'ERROR') colorClass = 'text-red-400 font-bold';
            if (level === 'SUCCESS') colorClass = 'text-cyber-green';
            if (level === 'WARN') colorClass = 'text-yellow-400';
            
            const div = document.createElement('div');
            div.innerHTML = `<span class="text-gray-600">[${timeStr}]</span> <span class="${colorClass}">[${level}]</span> ${text}`;
            body.appendChild(div);
            body.scrollTop = body.scrollHeight;
            console.log(`[${level}] ${text}`);
        };

        // UI Notification Utility
        window.showToast = function(title, message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const borderColor = type === 'error' ? 'border-red-500 text-red-400 bg-red-500/10' : 'border-cyber-cyan text-cyber-cyan bg-cyber-cyan/10';
            const icon = type === 'error' ? 'fa-triangle-exclamation text-red-500' : 'fa-circle-check text-cyber-cyan';
            toast.className = `backdrop-blur-md ${borderColor} border px-4 py-3 rounded-lg shadow-lg font-tech text-xs max-w-sm w-full pointer-events-auto transition-opacity duration-300 flex items-start space-x-3`;
            toast.innerHTML = `<i class="fa-solid ${icon} mt-0.5"></i><div class="flex-1"><div class="font-orbitron font-bold">${title}</div><div class="text-gray-300 mt-0.5">${message}</div></div>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 4500);
        };

        // UI Status Updater
        window.updateCloudStatus = function(statusText, textColorClass, dotColorClass, bgClass) {
            const badge = document.getElementById('cloud-status-badge');
            const dot = document.getElementById('cloud-status-dot');
            const text = document.getElementById('cloud-status-text');
            if (!badge || !dot || !text) return;
            badge.className = `inline-flex items-center space-x-2 px-3 py-1 mb-3 text-xs font-bold tracking-widest ${textColorClass} ${bgClass} rounded border border-current transition-colors duration-300`;
            dot.className = `w-2 h-2 ${dotColorClass} rounded-full animate-ping`;
            text.textContent = statusText;
        };

        document.getElementById('debug-header')?.addEventListener('click', () => {
            const body = document.getElementById('debug-body');
            const icon = document.getElementById('debug-toggle-icon');
            body.classList.toggle('hidden');
            icon.className = body.classList.contains('hidden') ? 'fa-solid fa-chevron-up text-gray-400' : 'fa-solid fa-chevron-down text-gray-400';
        });

        // XSS Prevention
        window.escapeHtml = function(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
        };

        window.generateCode = function() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        };
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global State variables
        let db = null;
        let auth = null;
        let currentUser = null;
        let unsubscribeMessages = null;
        let unsubscribeRoom = null;
        let currentRoomCode = null;
        let currentGamerTag = '';
        let isCloudMode = false;
        
        // Local Broadcast Channel fallback
        const bc = new BroadcastChannel('nexus_chat_fallback');

        // PHASE 1: Safe Configuration Extraction
        window.logDebug('INFO', 'Phase 1: Booting Configuration...');
        const appId = window.__app_id || (typeof __app_id !== 'undefined' ? __app_id : 'nexus-chat-app');
        let firebaseConfig = null;
        let customToken = window.__initial_auth_token || (typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null);

        // Safely attempt to parse without crashing
        try {
            let configRaw = window.__firebase_config || (typeof __firebase_config !== 'undefined' ? __firebase_config : null);
            if (configRaw) {
                if (typeof configRaw === 'string') {
                    firebaseConfig = JSON.parse(configRaw);
                } else {
                    firebaseConfig = configRaw;
                }
                
                if (firebaseConfig && firebaseConfig.projectId) {
                    window.logDebug('SUCCESS', `Found Cloud Config: ${firebaseConfig.projectId}`);
                } else {
                    firebaseConfig = null; // Invalid config format
                }
            }
        } catch (e) {
            window.logDebug('WARN', `Config parsing error: ${e.message}`);
            firebaseConfig = null;
        }

        // Phase 2: Dual-Sync Initialization
        if (firebaseConfig) {
            window.logDebug('INFO', 'Phase 2: Initializing Firebase Cloud...');
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                isCloudMode = true;
                
                // Strict Auth Flow
                window.updateCloudStatus('AUTHENTICATING...', 'text-yellow-400', 'bg-yellow-400', 'bg-yellow-400/10');
                if (customToken) {
                    signInWithCustomToken(auth, customToken).catch(e => window.logDebug('ERROR', `Token Auth Failed: ${e.message}`));
                } else {
                    signInAnonymously(auth).catch(e => window.logDebug('ERROR', `Anon Auth Failed: ${e.message}`));
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        document.getElementById('client-uuid').textContent = `UID: ${user.uid}`;
                        window.updateCloudStatus('CLOUD LINK SECURED', 'text-cyber-green', 'bg-cyber-green', 'bg-cyber-green/10');
                        document.getElementById('create-squad-btn').disabled = false;
                        document.getElementById('join-squad-btn').disabled = false;
                    } else {
                        currentUser = null;
                        document.getElementById('client-uuid').textContent = `OFFLINE`;
                        window.updateCloudStatus('LINK SEVERED', 'text-red-400', 'bg-red-500', 'bg-red-500/10');
                    }
                });

            } catch (initErr) {
                window.logDebug('ERROR', `Firebase Init Failed: ${initErr.message}`);
                fallbackToLocal();
            }
        } else {
            window.logDebug('WARN', 'No Firebase Config detected. Entering Local Fallback Mode.');
            fallbackToLocal();
        }

        function fallbackToLocal() {
            isCloudMode = false;
            currentUser = { uid: 'local-user-' + Math.floor(Math.random()*10000) };
            
            window.updateCloudStatus('LOCAL LINK ACTIVE', 'text-cyber-cyan', 'bg-cyber-cyan', 'bg-cyber-cyan/10');
            document.getElementById('client-uuid').textContent = `LOCAL_ID: ${currentUser.uid}`;
            
            document.getElementById('create-squad-btn').disabled = false;
            document.getElementById('join-squad-btn').disabled = false;
            
            // Handle local BC messages
            bc.onmessage = (event) => {
                const { type, roomCode, data } = event.data;
                if (roomCode !== currentRoomCode) return;

                if (type === 'MESSAGE') {
                    appendLocalMessage(data);
                } else if (type === 'ROSTER_SYNC') {
                    renderRoster(data.participants);
                }
            };
        }

        async function createSquad(e) {
            e.preventDefault();
            if (!currentUser) return window.showToast('DENIED', 'Authentication pending.', 'error');
            
            const inputTag = document.getElementById('create-gamer-tag').value.trim();
            if (!inputTag) return window.showToast('DENIED', 'Gamer Tag required.', 'error');

            currentGamerTag = inputTag;
            currentRoomCode = window.generateCode();
            
            window.logDebug('INFO', `Initializing squad channel: ${currentRoomCode}`);
            
            if (isCloudMode) {
                try {
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'nexus_rooms', currentRoomCode);
                    await setDoc(roomRef, {
                        roomCode: currentRoomCode,
                        createdAt: Date.now(),
                        participants: [currentGamerTag]
                    });

                    const messagesRef = collection(db, 'artifacts', appId, 'public', 'data', 'nexus_messages');
                    await addDoc(messagesRef, {
                        roomCode: currentRoomCode,
                        sender: 'SYSTEM',
                        text: `Squad channel ${currentRoomCode} initialized by ${currentGamerTag}.`,
                        timestamp: Date.now(),
                        type: 'system'
                    });
                    transitionToChat();
                } catch (err) {
                    window.logDebug('ERROR', `Create Room Error: ${err.message}`);
                    window.showToast('DATABASE ERROR', err.message, 'error');
                }
            } else {
                // Local Mode
                localStorage.setItem(`nexus_room_${currentRoomCode}`, JSON.stringify([currentGamerTag]));
                transitionToChat();
                appendLocalMessage({ sender: 'SYSTEM', text: `Local squad channel initialized by ${currentGamerTag}.`, type: 'system', timestamp: Date.now() });
            }
        }

        async function joinSquad(e) {
            e.preventDefault();
            if (!currentUser) return window.showToast('DENIED', 'Authentication pending.', 'error');

            const inputTag = document.getElementById('join-gamer-tag').value.trim();
            const inputCode = document.getElementById('join-room-code').value.trim();
            
            if (!inputTag) return window.showToast('DENIED', 'Gamer Tag required.', 'error');
            if (!inputCode || inputCode.length !== 6) return window.showToast('DENIED', 'Invalid 6-digit code.', 'error');

            currentGamerTag = inputTag;
            currentRoomCode = inputCode;
            
            if (isCloudMode) {
                try {
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'nexus_rooms', currentRoomCode);
                    const snap = await getDoc(roomRef);
                    
                    if (!snap.exists()) {
                        return window.showToast('404 NOT FOUND', 'Invalid or inactive frequency code.', 'error');
                    }

                    let parts = snap.data().participants || [];
                    if (!parts.includes(currentGamerTag)) {
                        parts.push(currentGamerTag);
                        await updateDoc(roomRef, { participants: parts });
                    }

                    const messagesRef = collection(db, 'artifacts', appId, 'public', 'data', 'nexus_messages');
                    await addDoc(messagesRef, {
                        roomCode: currentRoomCode,
                        sender: 'SYSTEM',
                        text: `${currentGamerTag} joined the squad.`,
                        timestamp: Date.now(),
                        type: 'system'
                    });
                    transitionToChat();
                } catch (err) {
                    window.logDebug('ERROR', `Join Error: ${err.message}`);
                }
            } else {
                // Local Mode
                let saved = localStorage.getItem(`nexus_room_${currentRoomCode}`);
                if (!saved) return window.showToast('404', 'Room not found locally.', 'error');
                
                let parts = JSON.parse(saved);
                if (!parts.includes(currentGamerTag)) {
                    parts.push(currentGamerTag);
                    localStorage.setItem(`nexus_room_${currentRoomCode}`, JSON.stringify(parts));
                }
                transitionToChat();
                const msg = { sender: 'SYSTEM', text: `${currentGamerTag} joined.`, type: 'system', timestamp: Date.now() };
                appendLocalMessage(msg);
                bc.postMessage({ type: 'MESSAGE', roomCode: currentRoomCode, data: msg });
                bc.postMessage({ type: 'ROSTER_SYNC', roomCode: currentRoomCode, data: { participants: parts } });
            }
        }

        async function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            
            if (!text || !currentRoomCode) return;
            input.value = '';

            const msgData = {
                roomCode: currentRoomCode,
                sender: currentGamerTag,
                text: text,
                timestamp: Date.now(),
                type: 'chat'
            };

            if (isCloudMode) {
                try {
                    const messagesRef = collection(db, 'artifacts', appId, 'public', 'data', 'nexus_messages');
                    await addDoc(messagesRef, msgData);
                } catch (err) {
                    window.showToast('TRANSMIT ERROR', err.message, 'error');
                }
            } else {
                appendLocalMessage(msgData);
                bc.postMessage({ type: 'MESSAGE', roomCode: currentRoomCode, data: msgData });
            }
        }

        function transitionToChat() {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            document.getElementById('display-room-code').textContent = currentRoomCode;
            document.getElementById('display-gamer-tag').textContent = currentGamerTag;
            document.getElementById('chat-messages').innerHTML = ''; // Clear old msgs
            
            window.showToast('CONNECTION SUCCESS', `Linked to ${currentRoomCode}`);
            
            if (isCloudMode) {
                startRealtimeSync();
            } else {
                let saved = localStorage.getItem(`nexus_room_${currentRoomCode}`);
                if (saved) renderRoster(JSON.parse(saved));
            }
        }

        function startRealtimeSync() {
            if (!currentRoomCode || !db) return;
            
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'nexus_rooms', currentRoomCode);
            unsubscribeRoom = onSnapshot(roomRef, (snap) => {
                if (snap.exists()) renderRoster(snap.data().participants || []);
            }, (error) => window.logDebug('ERROR', `Room Sync: ${error.message}`));

            const messagesRef = collection(db, 'artifacts', appId, 'public', 'data', 'nexus_messages');
            unsubscribeMessages = onSnapshot(messagesRef, (snapshot) => {
                let msgs = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data.roomCode === currentRoomCode) msgs.push(data);
                });
                msgs.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                
                document.getElementById('chat-messages').innerHTML = '';
                msgs.forEach(m => appendLocalMessage(m, true));
            }, (error) => window.logDebug('ERROR', `Messages Sync: ${error.message}`));
        }

        function renderRoster(participants) {
            const list = document.getElementById('roster-list');
            document.getElementById('roster-count').textContent = participants.length;
            list.innerHTML = '';

            participants.forEach(tag => {
                const isSelf = tag === currentGamerTag;
                const div = document.createElement('div');
                div.className = 'flex items-center space-x-2 p-2 rounded bg-cyber-darker border border-cyber-border truncate';
                div.innerHTML = `
                    <span class="w-2 h-2 bg-cyber-green rounded-full shrink-0"></span>
                    <span class="truncate text-xs ${isSelf ? 'text-cyber-cyan font-bold' : 'text-gray-300'}">${window.escapeHtml(tag)} ${isSelf ? '(YOU)' : ''}</span>
                `;
                list.appendChild(div);
            });
        }

        function appendLocalMessage(msg, isBulk = false) {
            const container = document.getElementById('chat-messages');
            const isScrolled = container.scrollHeight - container.clientHeight <= container.scrollTop + 20;
            
            const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const div = document.createElement('div');
            
            if (msg.type === 'system') {
                div.className = 'flex justify-center my-2';
                div.innerHTML = `<span class="bg-cyber-darker border border-cyber-border px-3 py-1 rounded-full text-[10px] text-cyber-green font-tech uppercase tracking-widest">${window.escapeHtml(msg.text)}</span>`;
            } else {
                const isMe = msg.sender === currentGamerTag;
                div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} mb-4`;
                div.innerHTML = `
                    <div class="flex items-center space-x-2 mb-1">
                        <span class="text-[10px] font-orbitron font-bold ${isMe ? 'text-cyber-cyan' : 'text-cyber-magenta'} uppercase">${window.escapeHtml(msg.sender)}</span>
                        <span class="text-[9px] text-gray-500">${timeStr}</span>
                    </div>
                    <div class="max-w-[85%] sm:max-w-[75%] px-4 py-2 text-sm font-tech leading-relaxed break-words shadow-lg ${isMe ? 'bg-cyber-cyan/10 border border-cyber-cyan/40 text-gray-100 rounded-lg rounded-tr-sm' : 'bg-cyber-card border border-cyber-border text-gray-200 rounded-lg rounded-tl-sm'}">
                        ${window.escapeHtml(msg.text)}
                    </div>
                `;
            }
            container.appendChild(div);
            if (isScrolled || !isBulk) container.scrollTop = container.scrollHeight;
        }

        async function disconnect() {
            if (currentRoomCode && currentGamerTag && isCloudMode) {
                try {
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'nexus_rooms', currentRoomCode);
                    const snap = await getDoc(roomRef);
                    if (snap.exists()) {
                        let parts = snap.data().participants || [];
                        parts = parts.filter(p => p !== currentGamerTag);
                        await updateDoc(roomRef, { participants: parts });
                    }
                    
                    const messagesRef = collection(db, 'artifacts', appId, 'public', 'data', 'nexus_messages');
                    await addDoc(messagesRef, {
                        roomCode: currentRoomCode, sender: 'SYSTEM',
                        text: `${currentGamerTag} severed link.`, timestamp: Date.now(), type: 'system'
                    });
                } catch (e) { /* ignore */ }
            } else if (!isCloudMode && currentRoomCode) {
                let saved = localStorage.getItem(`nexus_room_${currentRoomCode}`);
                if (saved) {
                    let parts = JSON.parse(saved).filter(p => p !== currentGamerTag);
                    localStorage.setItem(`nexus_room_${currentRoomCode}`, JSON.stringify(parts));
                    const msg = { sender: 'SYSTEM', text: `${currentGamerTag} severed link.`, type: 'system', timestamp: Date.now() };
                    bc.postMessage({ type: 'MESSAGE', roomCode: currentRoomCode, data: msg });
                    bc.postMessage({ type: 'ROSTER_SYNC', roomCode: currentRoomCode, data: { participants: parts } });
                }
            }

            if (unsubscribeMessages) unsubscribeMessages();
            if (unsubscribeRoom) unsubscribeRoom();
            
            currentRoomCode = null;
            document.getElementById('lobby-screen').classList.remove('hidden');
            document.getElementById('chat-screen').classList.add('hidden');
            window.showToast('DISCONNECTED', 'Link severed successfully.');
        }

        function attachDOMListeners() {
            document.getElementById('create-squad-btn')?.addEventListener('click', createSquad);
            document.getElementById('join-squad-btn')?.addEventListener('click', joinSquad);
            document.getElementById('chat-form')?.addEventListener('submit', sendMessage);
            document.getElementById('disconnect-btn')?.addEventListener('click', disconnect);
            
            document.getElementById('copy-code-btn')?.addEventListener('click', () => {
                if (!currentRoomCode) return;
                const ta = document.createElement('textarea');
                ta.value = currentRoomCode;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                window.showToast('COPIED', 'Frequency code saved to clipboard.');
            });

            const toggleSidebar = () => document.getElementById('sidebar')?.classList.toggle('-translate-x-full');
            document.getElementById('sidebar-toggle-btn')?.addEventListener('click', toggleSidebar);
            document.getElementById('sidebar-close-btn')?.addEventListener('click', toggleSidebar);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', attachDOMListeners);
        } else {
            attachDOMListeners();
        }
    </script>
</body>
</html>
