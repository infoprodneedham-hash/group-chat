<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL CHAT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        :root {
            --term-green: #39ff14; /* True neon green */
            --term-black: #050505;
            --term-red: #ff3333;
        }

        body {
            background-color: var(--term-black);
            color: var(--term-green);
            font-family: 'VT323', 'Courier New', Courier, monospace;
            font-size: 1.5rem; 
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        input {
            background-color: var(--term-black);
            color: var(--term-green);
            border: 1px solid var(--term-green);
            padding: 0.5rem;
            font-family: inherit;
            font-size: 1.5rem;
            outline: none;
            width: 100%;
            caret-color: var(--term-green);
            transition: border-width 0.1s;
        }

        input:focus {
            border-width: 2px;
        }

        button {
            background-color: var(--term-black);
            color: var(--term-green);
            border: 1px solid var(--term-green);
            padding: 0.5rem 1rem;
            font-family: inherit;
            font-size: 1.5rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.1s ease;
        }

        button:hover {
            background-color: var(--term-green);
            color: var(--term-black);
        }

        button:active {
            transform: scale(0.98);
        }

        .hide {
            display: none !important;
        }

        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: var(--term-black); border-left: 1px solid var(--term-green); }
        ::-webkit-scrollbar-thumb { background: var(--term-green); }

        .blink {
            animation: blink-animation 1s steps(2, start) infinite;
        }
        @keyframes blink-animation {
            to { visibility: hidden; }
        }
        
        .sys-error {
            color: var(--term-red);
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto w-full h-full flex flex-col border-2 border-[#39ff14] p-4 shadow-[0_0_15px_rgba(57,255,20,0.2)]">
        
        <header class="border-b border-[#39ff14] pb-2 mb-4">
            <h1 class="text-4xl uppercase m-0 leading-none tracking-widest">> SYS_COMM_LINK_V2</h1>
        </header>

        <!-- Boot Screen -->
        <main id="boot-screen" class="flex-1 flex flex-col justify-center items-center text-center">
            <div class="space-y-4">
                <div>> INITIALIZING NETWORK PROTOCOLS...</div>
                <div>> AUTHENTICATING CONNECTION...</div>
                <div class="blink">_</div>
            </div>
        </main>

        <!-- Lobby Screen -->
        <main id="lobby-screen" class="hide flex-1 flex flex-col justify-center max-w-lg mx-auto w-full space-y-8">
            <div class="space-y-2">
                <label class="block uppercase">> ENTER_OPERATOR_TAG</label>
                <input type="text" id="username-input" placeholder="e.g. NEO" maxlength="12" autocomplete="off">
            </div>

            <div class="border-t border-dashed border-[#39ff14] pt-8 space-y-6">
                <button id="btn-create" class="w-full">
                    [ INITIATE_NEW_ROOM ]
                </button>
                
                <div class="text-center">-- OR --</div>
                
                <div class="flex space-x-4">
                    <input type="text" id="join-code-input" placeholder="6-DIGIT CODE" maxlength="6" autocomplete="off" class="text-center tracking-widest w-2/3">
                    <button id="btn-join" class="w-1/3">
                        [ JOIN ]
                    </button>
                </div>
                <div id="lobby-error" class="sys-error text-lg hide">> ERROR: INVALID INPUT</div>
            </div>
        </main>

        <!-- Chat Screen -->
        <main id="chat-screen" class="hide flex-1 flex flex-col overflow-hidden">
            <div class="flex justify-between items-center border-b border-dashed border-[#39ff14] pb-2 mb-4 uppercase">
                <div id="chat-info" class="text-xl">OP: ??? | RM: ???</div>
                <button id="btn-disconnect" class="text-sm py-1 px-3">ABORT</button>
            </div>

            <div id="message-log" class="flex-1 overflow-y-auto flex flex-col space-y-2 mb-4 pb-2 pr-2">
                <!-- Messages populate here -->
            </div>

            <form id="chat-form" class="flex items-center space-x-4 mt-auto">
                <span class="mb-1 text-3xl">></span>
                <input type="text" id="chat-input" placeholder="TYPE TRANSMISSION HERE..." autocomplete="off">
                <button type="submit" id="btn-send" class="px-6">SEND</button>
            </form>
        </main>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Extract globals safely
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'retro-terminal-app';
        let firebaseConfig = {};
        let customToken = null;
        
        try {
            if (typeof __firebase_config !== 'undefined') firebaseConfig = JSON.parse(__firebase_config);
            if (typeof __initial_auth_token !== 'undefined') customToken = __initial_auth_token;
        } catch(e) {
            console.error("Config parse error.", e);
        }

        let app, auth, db;
        let currentUser = null;
        let myUsername = "";
        let currentRoom = "";
        let unsubscribe = null;
        let bootTimeout = null;

        // DOM Elements
        const bootScreen = document.getElementById('boot-screen');
        const lobbyScreen = document.getElementById('lobby-screen');
        const chatScreen = document.getElementById('chat-screen');
        
        const usernameInput = document.getElementById('username-input');
        const btnCreate = document.getElementById('btn-create');
        const joinCodeInput = document.getElementById('join-code-input');
        const btnJoin = document.getElementById('btn-join');
        const lobbyError = document.getElementById('lobby-error');
        
        const chatInfo = document.getElementById('chat-info');
        const btnDisconnect = document.getElementById('btn-disconnect');
        const messageLog = document.getElementById('message-log');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');

        async function bootSystem() {
            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUser = user;
                        bootScreen.classList.add('hide');
                        lobbyScreen.classList.remove('hide');
                        usernameInput.focus();
                    }
                });

                if (customToken) {
                    await signInWithCustomToken(auth, customToken);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth/Init Error:", err);
                bootScreen.innerHTML = `<div class="sys-error">> FATAL ERROR: NETWORK CONNECTION FAILED.<br>> ${err.message}</div>`;
            }
        }

        bootSystem();

        usernameInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase().replace(/\s/g, '');
            lobbyError.classList.add('hide');
        });

        joinCodeInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            lobbyError.classList.add('hide');
        });

        btnCreate.addEventListener('click', (e) => {
            e.preventDefault();
            const name = usernameInput.value.trim();
            if (!name) return showError("OPERATOR TAG REQUIRED");
            
            myUsername = name;
            currentRoom = Math.floor(100000 + Math.random() * 900000).toString();
            enterChat();
        });

        btnJoin.addEventListener('click', (e) => {
            e.preventDefault();
            const name = usernameInput.value.trim();
            const code = joinCodeInput.value.trim();
            
            if (!name) return showError("OPERATOR TAG REQUIRED");
            if (code.length !== 6) return showError("ROOM CODE MUST BE 6 DIGITS");

            myUsername = name;
            currentRoom = code;
            enterChat();
        });

        function showError(msg) {
            lobbyError.textContent = `> ERROR: ${msg}`;
            lobbyError.classList.remove('hide');
        }

        function enterChat() {
            lobbyScreen.classList.add('hide');
            chatScreen.classList.remove('hide');
            
            chatInfo.textContent = `OP: [${myUsername}] | RM: [${currentRoom}]`;
            chatInput.focus();
            
            messageLog.innerHTML = `
                <div class="opacity-70 italic">> LINK ESTABLISHED.</div>
                <div class="opacity-70 italic">> ROOM CODE: ${currentRoom}</div>
                <div class="opacity-70 italic mb-4">> AWAITING INCOMING TRANSMISSIONS...</div>
            `;
            
            startSync();
        }

        function startSync() {
            if (!currentUser || !currentRoom) return;

            const messagesRef = collection(db, 'artifacts', appId, 'public', 'data', 'retro_messages');

            unsubscribe = onSnapshot(messagesRef, (snapshot) => {
                const msgs = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.roomCode === currentRoom) {
                        msgs.push(data);
                    }
                });

                // Sort ascending by timestamp
                msgs.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                
                // Keep the header instructions and append all messages
                messageLog.innerHTML = `
                    <div class="opacity-70 italic">> LINK ESTABLISHED.</div>
                    <div class="opacity-70 italic mb-4">> ROOM CODE: [ ${currentRoom} ]</div>
                `;
                
                msgs.forEach(msg => {
                    const el = document.createElement('div');
                    const time = new Date(msg.timestamp).toLocaleTimeString([], { hour12: false });
                    
                    if (msg.sender === myUsername) {
                        el.innerHTML = `<span class="opacity-50">[${time}]</span> <strong>> YOU:</strong> ${escapeHtml(msg.text)}`;
                    } else {
                        el.innerHTML = `<span class="opacity-50">[${time}]</span> <strong>> ${escapeHtml(msg.sender)}:</strong> ${escapeHtml(msg.text)}`;
                    }
                    messageLog.appendChild(el);
                });
                
                // Scroll to bottom
                messageLog.scrollTop = messageLog.scrollHeight;

            }, (error) => {
                console.error("Sync Error:", error);
                const errDiv = document.createElement('div');
                errDiv.className = 'sys-error';
                errDiv.textContent = `> SYNC LOST: ${error.message}`;
                messageLog.appendChild(errDiv);
            });
        }

        chatForm.addEventListener('submit', async (e) => {
            // 1) Explicitly prevent default form submission
            e.preventDefault(); 
            
            const text = chatInput.value.trim();
            if (!text) return; // Don't send empty messages

            // Instantly clear and refocus
            chatInput.value = ""; 
            chatInput.focus();

            // Safety check
            if (!currentUser || !currentRoom) {
                const errDiv = document.createElement('div');
                errDiv.className = 'sys-error';
                errDiv.textContent = `> TRANSMISSION FAILED: SYSTEM OFFLINE.`;
                messageLog.appendChild(errDiv);
                return;
            }

            try {
                // 3) Write message object to Firestore
                const messagesRef = collection(db, 'artifacts', appId, 'public', 'data', 'retro_messages');
                await addDoc(messagesRef, {
                    roomCode: currentRoom,
                    sender: myUsername,
                    text: text,
                    timestamp: Date.now()
                });
                
                console.log("Transmission sent successfully.");
                // Note: onSnapshot listener automatically picks this up and renders it instantly.

            } catch (err) {
                // 5) Explicit console error and on-screen rendering if dispatch fails
                console.error("Message Dispatch Failed:", err);
                const errDiv = document.createElement('div');
                errDiv.className = 'sys-error';
                errDiv.textContent = `> ERROR TRANSMITTING: ${err.message}`;
                messageLog.appendChild(errDiv);
                messageLog.scrollTop = messageLog.scrollHeight;
            }
        });

        btnDisconnect.addEventListener('click', () => {
            if (unsubscribe) {
                unsubscribe();
                unsubscribe = null;
            }
            currentRoom = "";
            chatScreen.classList.add('hide');
            lobbyScreen.classList.remove('hide');
            joinCodeInput.value = "";
            usernameInput.focus();
        });

        function escapeHtml(str) {
            if (!str) return '';
            return str.toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
